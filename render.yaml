services:
  - type: web
    name: vansrouter-proxy
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 20128
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NODE_OPTIONS
        value: --max-old-space-size=192
      - key: HEADROOM_ENABLED
        value: 1
      - key: HEADROOM_PROXY_ONLY
        value: true
      - key: HEADROOM_SUPERVISED
        value: 1
      - key: HEADROOM_URL
        value: http://127.0.0.1:8787
      - key: HEADROOM_HOST
        value: 127.0.0.1
      - key: HEADROOM_PORT
        value: 8787
      - key: HEADROOM_TELEMETRY
        value: off
      - key: HEADROOM_STATELESS
        value: true
      - key: HEADROOM_WORKERS
        value: 1
      - key: HEADROOM_LIMIT_CONCURRENCY
        value: 8
      - key: HEADROOM_MAX_CONNECTIONS
        value: 16
      - key: HEADROOM_MAX_KEEPALIVE
        value: 4
      - key: HEADROOM_KEEPALIVE_EXPIRY
        value: 10
      - key: HEADROOM_COMPRESSION_MAX_WORKERS
        value: 1
      - key: HEADROOM_ANTHROPIC_PRE_UPSTREAM_CONCURRENCY
        value: 2
      - key: HEADROOM_PERIODIC_TOIN_STATS
        value: 0
      - key: HEADROOM_NO_SUBSCRIPTION_TRACKING
        value: 1
      - key: HEADROOM_MALLOC_TRIM
        value: 1
      - key: HEADROOM_MALLOC_TRIM_INTERVAL_SECONDS
        value: 60
      - key: HF_HUB_OFFLINE
        value: 1
      - key: TRANSFORMERS_OFFLINE
        value: 1
      - key: TOKENIZERS_PARALLELISM
        value: false
      - key: MALLOC_ARENA_MAX
        value: 2
      - key: OMP_NUM_THREADS
        value: 1
      - key: MKL_NUM_THREADS
        value: 1
      - key: NUMEXPR_NUM_THREADS
        value: 1
