services:
  - type: web
    name: vansrouter-proxy
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 20128
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
